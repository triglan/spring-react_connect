<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>진열장</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="montage.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Pretendard JP',Pretendard,system-ui,sans-serif;color:#EADCC3;background:#15100C}
</style>
</helmet>
<div class="app-shell" style="width: 1280px; height: 1580px;">
<header class="app-header">
<div class="app-header-inner">
<a class="app-logo" href="Main.dc.html">
<span class="app-logo-mark is-lit" aria-hidden="true"><svg class="flicker" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1.5 3.2 5 5.6 5 10a5 5 0 0 1-10 0c0-2.4 1.2-3.9 2.5-5.2.3 1.6 1.1 2.7 2.3 3.2C11.2 7.8 11.3 4.6 12 2z"></path></svg></span>
<span class="heading1 display-font">모험가의 식탁</span>
</a>
<nav aria-label="주요 메뉴">
<ul class="app-nav">
<li><a class="app-nav-link label1 bold active" href="MenuList.dc.html">진열장</a></li>
<li><a class="app-nav-link label1 bold" href="MenuForm.dc.html">카드 들이기</a></li>
<li><a class="app-nav-link label1 bold" href="Backpack.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>배낭 <span class="nav-count caption1 bold">5</span></a></li>
</ul>
</nav>
</div>
</header>
<main class="app-main">
<div class="page-head">
<div class="page-head-text">
<h1 class="page-title title2 display-font">오늘의 진열장</h1>
<p class="page-desc body2 regular">“어서 오게, 모험가. 오늘 들어온 카드는 36장이라네.” · 1 / 3 쪽</p>
</div>
<a class="btn btn-primary label1 bold" href="MenuForm.dc.html">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
카드 들이기
</a>
</div>

<form class="panel" style="padding: var(--spacing-20); display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr) minmax(0, 1.3fr) auto; gap: var(--spacing-12); align-items: end;">
<div class="field">
<label class="field-label label2 bold" for="q">카드 이름</label>
<div class="control">
<span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>
<input id="q" class="body2 regular" type="search" placeholder="카드 이름 검색">
</div>
</div>
<div class="field">
<label class="field-label label2 bold" for="category">요리 계통</label>
<div class="control">
<select id="category" class="body2 regular">
<option>모든 계통</option>
<optgroup label="식사"><option>한식</option><option>중식</option><option>일식</option><option>퓨전</option></optgroup>
<optgroup label="음료"><option>커피</option><option>쥬스</option><option>기타</option></optgroup>
<optgroup label="디저트"><option>동양</option><option>서양</option></optgroup>
</select>
</div>
</div>
<div class="field">
<label class="field-label label2 bold" for="price">몸값</label>
<div class="control">
<input id="price" class="body2 regular" type="number" placeholder="예: 10000">
<span class="suffix label1 bold">G 넘는 것만</span>
</div>
</div>
<div style="display: flex; gap: var(--spacing-8);">
<button class="btn btn-outlined label1 medium" type="reset">비우기</button>
<button class="btn btn-primary label1 bold" type="submit">찾기</button>
</div>
</form>

<div style="display: flex; align-items: center; justify-content: space-between;">
<p class="label1 medium" style="color: var(--color-game-label-normal);">진열된 카드 12장 · 최근 들어온 순</p>
<div class="legend caption1 medium" aria-label="레어도">
<span class="legend-item rarity-common"><span class="gem"></span>일반</span>
<span class="legend-item rarity-uncommon"><span class="gem"></span>고급</span>
<span class="legend-item rarity-rare"><span class="gem"></span>희귀</span>
<span class="legend-item rarity-epic"><span class="gem"></span>영웅</span>
<span class="legend-item rarity-legendary"><span class="gem"></span>전설</span>
</div>
</div>

<div class="menu-grid">
<sc-for list="{{menus}}" as="m" hint-placeholder-count="12">
<div class="{{m.slotClass}}" style="{{m.tiltStyle}}">
<a class="{{m.cardClass}}" href="MenuDetail.dc.html">
<div class="menu-card-top">
<span class="card-no caption1 bold">No.{{m.no}}</span>
<span class="rarity-tag caption1 bold"><span class="gem"></span>{{m.rarityName}}</span>
</div>
<div class="card-art">
<sc-if value="{{m.art_korean}}" hint-placeholder-val="{{false}}"><svg class="cat-art" viewBox="0 0 64 64" aria-hidden="true"><path d="M10 30h44"></path><path d="M12 30c0 13 9 22 20 22s20-9 20-22"></path><path d="M25 52h14"></path><path d="M17 30c2-7 8-10 15-8 6-4 13-2 15 8" fill="currentColor" fill-opacity="0.18"></path><path d="M40 7 28 25"></path><path d="M47 9 33 26"></path></svg></sc-if>
<sc-if value="{{m.art_chinese}}" hint-placeholder-val="{{false}}"><svg class="cat-art" viewBox="0 0 64 64" aria-hidden="true"><path d="M12 42c0-14 40-14 40 0-6 5-34 5-40 0z" fill="currentColor" fill-opacity="0.18"></path><path d="M24 31l2 6M32 29v7M40 31l-2 6"></path><path d="M26 20c-2-4 2-6 0-10M38 20c-2-4 2-6 0-10"></path><path d="M8 50h48"></path></svg></sc-if>
<sc-if value="{{m.art_japanese}}" hint-placeholder-val="{{false}}"><svg class="cat-art" viewBox="0 0 64 64" aria-hidden="true"><path d="M16 38h32a6 6 0 0 1 0 12H16a6 6 0 0 1 0-12z"></path><path d="M11 38c4-10 38-12 42-3-3 4-37 5-42 3z" fill="currentColor" fill-opacity="0.18"></path><path d="M24 32l-2 5M34 30l-2 7M44 30l-2 6"></path><path d="M29 36h8v14h-8z" fill="currentColor" fill-opacity="0.35"></path></svg></sc-if>
<sc-if value="{{m.art_fusion}}" hint-placeholder-val="{{false}}"><svg class="cat-art" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 8v14c0 4 8 4 8 0V8M22 8v14M22 26v30"></path><path d="M36 17a6 9 0 1 0 12 0a6 9 0 1 0-12 0z" fill="currentColor" fill-opacity="0.18"></path><path d="M42 26v30"></path><path d="M32 34l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="currentColor" fill-opacity="1"></path></svg></sc-if>
<sc-if value="{{m.art_coffee}}" hint-placeholder-val="{{false}}"><svg class="cat-art" viewBox="0 0 64 64" aria-hidden="true"><path d="M16 26h28v10c0 9-6 14-14 14s-14-5-14-14z" fill="currentColor" fill-opacity="0.18"></path><path d="M44 29c8 0 8 11 0 11"></path><path d="M10 54h40"></path><path d="M24 18c-2-4 2-6 0-10M34 18c-2-4 2-6 0-10"></path></svg></sc-if>
<sc-if value="{{m.art_juice}}" hint-placeholder-val="{{false}}"><svg class="cat-art" viewBox="0 0 64 64" aria-hidden="true"><path d="M20 16h24l-4 38H24z"></path><path d="M21.3 28h21.4L40 54H24z" fill="currentColor" fill-opacity="0.25"></path><path d="M34 22l4-16 6-2"></path><path d="M39 18a7 7 0 1 0 14 0a7 7 0 1 0-14 0z" fill="currentColor" fill-opacity="0.18"></path><path d="M46 11v14M39 18h14"></path></svg></sc-if>
<sc-if value="{{m.art_etc}}" hint-placeholder-val="{{false}}"><svg class="cat-art" viewBox="0 0 64 64" aria-hidden="true"><path d="M26 5h12v5H26z"></path><path d="M28 19c-11 4-14 16-9 25 4 7 22 7 26 0 5-9 2-21-9-25V10h-8z"></path><path d="M17.6 35c6.4-3 22.4 3 28.8 0 .6 4-.4 6.9-1.4 9-4 7-22 7-26 0-1-2.1-1.8-5-1.4-9z" fill="currentColor" fill-opacity="0.3"></path><path d="M26 42a2 2 0 1 0 4 0a2 2 0 1 0-4 0zM33.5 38a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0z" fill="currentColor" fill-opacity="1"></path></svg></sc-if>
<sc-if value="{{m.art_eastern}}" hint-placeholder-val="{{false}}"><svg class="cat-art" viewBox="0 0 64 64" aria-hidden="true"><path d="M12 56 52 8"></path><path d="M16 43a7 7 0 1 0 14 0a7 7 0 1 0-14 0z" fill="currentColor" fill-opacity="0.18"></path><path d="M25 32a7 7 0 1 0 14 0a7 7 0 1 0-14 0z" fill="currentColor" fill-opacity="0.3"></path><path d="M34 21a7 7 0 1 0 14 0a7 7 0 1 0-14 0z" fill="currentColor" fill-opacity="0.18"></path></svg></sc-if>
<sc-if value="{{m.art_western}}" hint-placeholder-val="{{false}}"><svg class="cat-art" viewBox="0 0 64 64" aria-hidden="true"><path d="M10 46h44V30L10 38z" fill="currentColor" fill-opacity="0.18"></path><path d="M10 42l44-6"></path><path d="M42 24a4 4 0 1 0 8 0a4 4 0 1 0-8 0z" fill="currentColor" fill-opacity="1"></path><path d="M46 20c0-4 3-6 6-7"></path></svg></sc-if>
<sc-if value="{{m.art_default}}" hint-placeholder-val="{{true}}"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h18"></path><path d="M5 17a7 7 0 0 1 14 0"></path><path d="M12 10V8"></path><path d="M10.5 8h3"></path><path d="M4 20h16"></path></svg></sc-if>
<span class="category caption1 medium">{{m.categoryName}}</span>
<sc-if value="{{m.soldOut}}" hint-placeholder-val="{{false}}">
<span class="stamp label1 bold">품절</span>
</sc-if>
</div>
<p class="menu-card-name headline1 display-font">{{m.menuName}}</p>
<div class="menu-card-foot">
<span class="price headline2 bold">{{m.price}}<span class="caption1 bold">G</span></span>
<sc-if value="{{m.orderable}}" hint-placeholder-val="{{true}}">
<span class="status status-on caption1 bold"><span class="dot"></span>판매 중</span>
</sc-if>
<sc-if value="{{m.soldOut}}" hint-placeholder-val="{{false}}">
<span class="status status-off caption1 bold"><span class="dot"></span>품절</span>
</sc-if>
</div>
</a>
<sc-if value="{{m.bagOpen}}" hint-placeholder-val="{{true}}">
<button class="bag-btn caption1 bold" type="button" aria-label="{{m.menuName}} 배낭에 담기"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>담기</button>
</sc-if>
<sc-if value="{{m.bagAdded}}" hint-placeholder-val="{{false}}">
<button class="bag-btn is-added caption1 bold" type="button" aria-label="{{m.menuName}} 하나 더 담기"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>배낭에 2</button>
</sc-if>
<sc-if value="{{m.soldOut}}" hint-placeholder-val="{{false}}">
<button class="bag-btn caption1 bold" type="button" disabled="disabled">담을 수 없음</button>
</sc-if>
</div>
</sc-for>
</div>

<nav class="pagination" aria-label="쪽">
<button class="page-btn label1 medium" type="button" disabled="disabled" aria-label="앞 쪽">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<button class="page-btn is-current label1 bold" type="button" aria-current="page">1</button>
<button class="page-btn label1 medium" type="button">2</button>
<button class="page-btn label1 medium" type="button">3</button>
<button class="page-btn label1 medium" type="button" aria-label="다음 쪽">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</nav>
</main>
<footer class="app-footer">
<div class="app-footer-inner">
<p class="caption1 medium">모험가의 식탁 · 밤에만 여는 요리 카드 가게</p>
<p class="caption1 regular">Montage 디자인 토큰 · Spring Boot 메뉴 API</p>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1580}}'>
class Component extends DCLogic {
renderVals() {
var raw = [
[36, '초능력자의 에너지볼', 9500, '음료', 'Y'],
[35, '백년초 스무디', 5600, '기타', 'Y'],
[34, '귀신이 곡한 누룽지', 7000, '중식', 'Y'],
[33, '마법사의 램버거', 11000, '식사', 'Y'],
[32, '외계인의 초록 젤리', 4200, '동양', 'Y'],
[31, '펭귄의 꿈 파르페', 8500, '기타', 'Y'],
[30, '불타는 치킨', 9900, '식사', 'N'],
[29, '드래곤 숨결 핫소스', 3000, '식사', 'Y'],
[28, '신비로운 유니콘 아이스크림', 5500, '기타', 'Y'],
[27, '해적왕의 보물 상자', 12000, '동양', 'Y'],
[26, '달빛 요정 케이크', 7500, '서양', 'Y'],
[25, '바다의 속삭임 스무디', 6500, '기타', 'Y']
];
var rarity = function (price) {
if (price >= 20000) return ['legendary', '전설'];
if (price >= 12000) return ['epic', '영웅'];
if (price >= 8000) return ['rare', '희귀'];
if (price >= 5000) return ['uncommon', '고급'];
return ['common', '일반'];
};
return {
menus: raw.map(function (r, i) {
var rr = rarity(r[2]);
var cls = 'menu-card rarity-' + rr[0];
if (r[4] === 'N') cls += ' is-soldout';
return {
slotClass: i === 9 ? 'card-slot is-tilting' : 'card-slot',
tiltStyle: i === 9 ? '--tilt-x: 0.6; --tilt-y: -0.4; --gloss-x: 78%; --gloss-y: 22%;' : '',
bagAdded: i === 0,
bagOpen: r[4] === 'Y' && i !== 0,
no: String(r[0]).padStart(3, '0'),
menuName: r[1],
price: r[2].toLocaleString('ko-KR') + ' ',
categoryName: r[3],
art_korean: r[3] === '한식',
art_chinese: r[3] === '중식',
art_japanese: r[3] === '일식',
art_fusion: r[3] === '퓨전',
art_coffee: r[3] === '커피',
art_juice: r[3] === '쥬스',
art_etc: r[3] === '기타',
art_eastern: r[3] === '동양',
art_western: r[3] === '서양',
art_default: ['한식','중식','일식','퓨전','커피','쥬스','기타','동양','서양'].indexOf(r[3]) < 0,
rarityName: rr[1],
orderable: r[4] === 'Y',
soldOut: r[4] === 'N',
cardClass: cls
};
})
};
}
}
</script>
</body>
</html>
